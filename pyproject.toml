[project]
name = "discord-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rodrigo Riera", email = "rriera@fi.uba.ar" }
]
requires-python = ">=3.13"
dependencies = [
    "discord-py[voice]>=2.7.1",
    "dotenv>=0.9.9",
    "logging>=0.4.9.6",
    "spotipy>=2.26.0",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
discord-bot = "discord_bot:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
